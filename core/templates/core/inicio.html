<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plataforma de Encuestas</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: #17324d;
            background: linear-gradient(135deg, #dceff2, #f7fbf9);
        }
        main {
            max-width: 42rem;
            margin: 1.5rem;
            padding: 3rem;
            text-align: center;
            background: white;
            border: 1px solid #c9dce2;
            border-radius: 12px;
            box-shadow: 0 1rem 3rem rgba(23, 50, 77, 0.12);
        }
        h1 { color: #147d92; }
        p { line-height: 1.6; }
    </style>
</head>
<body>
    <main>
        <h1>Plataforma de Encuestas</h1>
        <p>Bienvenido/a al sistema de gestion de encuestas.</p>
        <p>Este proyecto permitira crear, administrar y responder encuestas.</p>
    </main>
</body>
</html>
